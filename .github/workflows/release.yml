name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Read Maven settings
        uses: actions/cache@v6
        with:
          path: .github/settings.xml
          key: maven-settings-${{ github.run_id }}
          restore-keys: maven-settings-

      - name: Build and Deploy to Maven Central
        run: |
          mvn clean deploy \
            -DskipTests \
            -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }} \
            -Dgpg.keyname=${{ secrets.GPG_KEYNAME }} \
            -Dsettings.file=.github/settings.xml
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
